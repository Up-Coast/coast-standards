# mypy (mypy.readthedocs.io/en/stable/config_file.html). Installed by Coast
# beside ruff.toml; yours to edit. Rules held here (enforcement/README.md
# section 5.2):
#   STYLE-1 — the type checker runs with the linter, no exemptions accumulating.
#   STYLE-2 — mypy:strict — every optional error check is on, so untyped public
#             surface (an unannotated def, an implicit Any) is an error.
[mypy]
strict = True
# The enforcement layer's own folder is not the project's code (see ruff.toml). mypy's
# exclude is a regular expression -- `mypy --help`: "Regular expression to match file
# names, directory names or paths which mypy should ignore" -- so the layout table fills
# `{state_dir_regex}`, the same name with its regex characters escaped.
exclude = ^{state_dir_regex}/
warn_unreachable = True
show_error_codes = True
