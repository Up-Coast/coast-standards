name: release

# Publishes a GitHub release for a version that already has a tag. Every merge to main
# is tagged by the checks workflow; a release is published only when someone runs this
# workflow (Actions → release → Run workflow), naming the version.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to publish, for example 1.6.3 (its tag v<version> must exist)"
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
      - name: The tag must match CHECKS-VERSION
        env:
          VERSION: ${{ inputs.version }}
        run: |
          file="$(tr -d '[:space:]' < CHECKS-VERSION)"
          if [ "$VERSION" != "$file" ]; then
            echo "FAIL release: v$VERSION holds CHECKS-VERSION $file" >&2
            exit 1
          fi
      - name: The changelog must carry this version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## " v " " {on=1; print; next}
            /^## / && on {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "FAIL release: CHANGELOG.md has no '## $VERSION — <date>' section" >&2
            exit 1
          fi
          cat notes.md
      - name: Publish the GitHub release with the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release create "v$VERSION" --title "Coast Standards $VERSION" --notes-file notes.md
