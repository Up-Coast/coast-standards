name: release

# Every merge to main is published by the checks workflow. Run this by hand only to
# publish a version that is missing from the releases page (Actions → release → Run
# workflow), naming the version. Its tag v<version> must exist.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to publish, for example 1.9.1 (its tag v<version> must exist)"
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
      - name: The tag must match CHECKS-VERSION
        env:
          VERSION: ${{ inputs.version }}
        run: |
          file="$(tr -d '[:space:]' < CHECKS-VERSION)"
          if [ "$VERSION" != "$file" ]; then
            echo "FAIL release: v$VERSION holds CHECKS-VERSION $file" >&2
            exit 1
          fi
      - name: Publish the GitHub release with the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          python3 tools/release_notes.py "$VERSION" > notes.md
          cat notes.md
          gh release create "v$VERSION" --title "Coast Standards $VERSION" --notes-file notes.md --verify-tag
