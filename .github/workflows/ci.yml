name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: jscpd, the duplicate-code tool the pre-push seat runs (pinned)
        run: npm install -g jscpd@5.1.2
      - name: Git identity for the test fixtures
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
      - name: Every rule names a check that runs (against the committed baseline)
        run: python3 enforcement/checks/verify_rules.py --baseline enforcement/checks/verify-baseline.json --summary
      - name: The enforcement layer's own tests
        run: python3 -m unittest discover -s enforcement/checks/tests -p 'test_*.py'

  publish-version:
    # Every merge to main is a release. Once the checks pass, tag the commit
    # v<CHECKS-VERSION> and publish a GitHub release with its changelog section.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag this version
        run: |
          version="$(tr -d '[:space:]' < CHECKS-VERSION)"
          tag="v$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            if [ "$(git rev-list -n 1 "$tag")" = "$GITHUB_SHA" ]; then
              echo "$tag already marks this commit"
              exit 0
            fi
            echo "FAIL version: $tag already marks another commit, so this merge did not raise CHECKS-VERSION" >&2
            exit 1
          fi
          python3 tools/version.py check "" "$GITHUB_SHA"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already published"
            exit 0
          fi
          python3 tools/release_notes.py "$VERSION" > notes.md
          gh release create "v$VERSION" --title "Coast Standards $VERSION" --notes-file notes.md --verify-tag
